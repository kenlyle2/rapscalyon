[pack]
name = "jobs-tracker"
prefix = "jb"
version = "0.1.0"
description = "Track job applications through a pipeline, with a per-application event log. A generic tracker, not an auto-apply engine."
license = "GPL-3.0-or-later"
requires_core = ">=0.1"
requires = []
conflicts = []

[db]
tables = ["jb_applications", "jb_application_events"]
functions = ["jb_log_status_change"]

[credits]
operations = [{ name = "jb.tailor_resume", label = "Tailor resume to a posting" }]

[limits]
jb_max_applications = { default = 100, note = "tracked applications per subject" }

[nav]
entries = [{ label = "Applications", href = "/applications", icon = "Briefcase", group = "main" }]

[health]
checks = ["jb_stale_applications"]
