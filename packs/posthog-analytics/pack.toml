[pack]
name = "posthog-analytics"
prefix = "ph"
version = "0.1.0"
description = "PostHog product analytics with privacy controls: per-user analytics/session-replay consent that the app must check before sending any event. Keys stay in the app environment."
license = "AGPL-3.0-or-later"
tier = "official"
requires_core = ">=0.1"
requires = []
conflicts = []

[db]
tables = ["ph_consent"]
functions = ["ph_may_track"]

[nav]
entries = [{ label = "Privacy", href = "/settings/privacy", icon = "Shield", group = "settings" }]
