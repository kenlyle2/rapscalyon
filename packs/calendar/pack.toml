[pack]
name = "calendar"
prefix = "cal"
version = "0.1.0"
description = "A shared calendar: appointments, classes, deadlines. Other features add their events to it through one service-only feed, so scheduled posts, bookings and plans show up in one place."
license = "AGPL-3.0-or-later"
tier = "official"
requires_core = ">=0.1"
requires = ["people"]
conflicts = []

[db]
tables = ["cal_events"]
functions = ["cal_upsert_event", "cal_remove_source"]
api_functions = []

[nav]
entries = [{ label = "Calendar", href = "/calendar", icon = "CalendarDays", group = "main" }]
