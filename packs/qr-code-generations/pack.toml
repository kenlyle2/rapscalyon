[pack]
name = "qr-code-generations"
prefix = "qrg"
version = "0.1.1"
description = "AI QR-code generation jobs (the BuilderKit qr_code_generations table) as a child of item-tracker: prompt, target URL and an image key, charged up front or recorded from an outside generator."
license = "AGPL-3.0-or-later"
tier = "official"
requires_core = ">=0.1"
requires = ["item-tracker"]
conflicts = []

[db]
tables = ["qrg_codes"]
functions = ["qrg_valid_keys", "qrg_check_kind", "qrg_request", "qrg_mark_started", "qrg_complete", "qrg_fail", "qrg_record"]
api_functions = ["qrg_request"]

[credits]
operations = [{ name = "qrg.generate", label = "Generate a QR code" }]
