[pack]
name = "billing-webhook"
prefix = "bw"
version = "0.1.0"
description = "Provider-agnostic subscription sync (FluentCart, WooCommerce, Stripe, anything that can POST a webhook): idempotent event application onto core profiles, plan-to-tier mapping, stale/out-of-order protection, and an unmatched-event health check."
license = "AGPL-3.0-or-later"
tier = "official"
requires_core = ">=0.1"
requires = []
conflicts = []

[db]
tables = ["bw_plan_map"]
functions = ["bw_apply_event", "bw_unmatched_events"]

[nav]
entries = [{ label = "Billing plans", href = "/admin/billing-plans", icon = "CreditCard", group = "admin" }]

[health]
checks = ["bw_unmatched_events"]
