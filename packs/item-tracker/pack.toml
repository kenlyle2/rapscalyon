[pack]
name = "item-tracker"
prefix = "it"
version = "0.1.0"
description = "The base class for anything a subject tracks: a typed item (job, listing, lead, ...) with notes, a link and an append-only event log. Child packs add typed columns for one kind of item."
license = "AGPL-3.0-or-later"
tier = "official"
requires_core = ">=0.1"
requires = []
conflicts = []

[db]
tables = ["it_items", "it_item_events"]
functions = ["it_enforce_item_limit", "it_log_event"]

[limits]
it_max_items = { default = 100, note = "unarchived items per subject (applies to browser/API users; service-role code is exempt)" }

[nav]
entries = [{ label = "Items", href = "/items", icon = "List", group = "main" }]
