[pack]
name = "image-transforms"
prefix = "itr"
version = "0.1.0"
description = "Image upscale, enhance and style-transfer jobs (BuilderKit image_enhancer_upscaler and ghibli_generation tables) as a child of item-tracker: the input key, the result key and a free-text transform type, charged up front or recorded from an outside generator."
license = "AGPL-3.0-or-later"
tier = "official"
requires_core = ">=0.1"
requires = ["item-tracker"]
conflicts = []

[db]
tables = ["itr_jobs"]
functions = ["itr_valid_keys", "itr_check_kind", "itr_request", "itr_mark_started", "itr_complete", "itr_fail", "itr_record"]
api_functions = ["itr_request"]

[credits]
operations = [{ name = "itr.run", label = "Transform an image" }]
