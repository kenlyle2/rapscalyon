name: GenAI-Logic docs check

# Monthly: have the GenAI-Logic pages or the logicbank / ApiLogicServer releases changed since the last build
# of the Pickaxe knowledge document? If so, open an issue. Nothing is published automatically.
on:
  schedule:
    - cron: '0 14 1 * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compare with the last build
        id: check
        run: |
          set +e
          python3 tools/genai_docs.py check | tee check.txt
          echo "changed=$([ ${PIPESTATUS[0]} -ne 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Open an issue if something changed
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "The GenAI-Logic documentation or releases changed since the last build."
            echo
            echo '```'
            cat check.txt
            echo '```'
            echo
            echo "To refresh the Pickaxe knowledge document (changes Pickaxe, so run it on purpose):"
            echo
            echo '```'
            echo "python3 tools/genai_docs.py build"
            echo "python3 tools/genai_docs.py publish"
            echo '```'
            echo
            echo "Then re-run the retrieval questions in docs/PICKAXE.md and packs/invoice-refunds/rules/poc/run_scenarios.py, and commit pickaxe/kb/genai-logic.state.json."
          } > body.md
          gh issue create --title "GenAI-Logic docs changed ($(date +%Y-%m))" --body-file body.md
