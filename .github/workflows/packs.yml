name: Packs

# Pull requests: the pack gate (generated files current, versions bumped, every official pack installs, passes its tests and removes cleanly).
# Pushes to main: report knowledge documents in Pickaxe that no longer match the repo. Nothing is published automatically.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generated files are current
        run: |
          python3 tools/rapscalyon.py catalog
          if [ -n "$(git status --porcelain)" ]; then
            echo "Generated files are out of date. Run 'python3 tools/rapscalyon.py catalog' and commit:"; git status --porcelain; exit 1
          fi
      - name: A changed pack has a higher version
        run: python3 tools/rapscalyon.py registry-check "origin/${{ github.base_ref }}"
      - name: Install order resolves
        run: python3 tools/ci_packs.py --plan
      - name: App types
        working-directory: app
        run: |
          npm ci
          npx tsc --noEmit
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1   # the version supabase/config.toml was written with
      - name: Local Supabase (throwaway)
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,mailpit,postgres-meta
      - name: Install, test and remove every official pack
        run: python3 tools/ci_packs.py
