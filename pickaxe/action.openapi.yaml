openapi: 3.0.3
info: { title: rapscalyon_api, version: "0.1.0" }
servers: [{ url: https://YOUR-APP-HOST }]
paths:
  /api/interview:
    post:
      operationId: rapscalyon_api
      summary: Pack catalog, stack proposal and confirmation for the setup interview
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [operation]
              properties:
                operation: { type: string, enum: [get_context, propose_stack, confirm_stack] }
                answers:
                  type: object
                  properties:
                    kind: { type: string, enum: [individual, business] }
                    needs: { type: array, items: { type: string, enum: [job-search, social, real-estate] } }
                    team: { type: boolean }
                    sells_subscriptions: { type: boolean }
                    public_forms: { type: boolean }
                    wants_email: { type: boolean }
                    wants_analytics: { type: boolean }
                proposal_id: { type: string }
                accepted: { type: boolean }
      responses: { "200": { description: OK } }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer }
